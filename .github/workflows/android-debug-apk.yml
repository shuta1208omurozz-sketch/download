name: Build FloatSaver APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'qa/**'
      - '.github/workflows/android-debug-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: floatsaver-latest-debug-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate XML, layout references, and media scanner
        run: |
          python3 qa/check.py
          python3 qa/check-browser-js.py

      - name: Read the Android app version
        id: version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          gradle_file = Path("app/build.gradle.kts").read_text(encoding="utf-8")
          match = re.search(r'\bversionName\s*=\s*"([^"]+)"', gradle_file)
          if not match:
              raise SystemExit("Missing versionName in app/build.gradle.kts")
          version = match.group(1)
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,60}", version):
              raise SystemExit("Invalid versionName for the APK file name")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"name={version}", file=output)
          print(f"APK version: {version}; build: {os.environ['GITHUB_RUN_NUMBER']}")
          PY

      - name: Restore stable Android signing key
        env:
          FLOATSAVER_SIGNING_SECRET: ${{ secrets.FLOATSAVER_SIGNING_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${FLOATSAVER_SIGNING_SECRET}" ]]; then
            echo "::error::One-time setup needed. Add the repository Actions secret FLOATSAVER_SIGNING_SECRET, then run this workflow again."
            exit 1
          fi
          SIGNING_FILE="$RUNNER_TEMP/floatsaver-signing.p12"
          base64 --decode signing/floatsaver-signing.p12.enc.b64 | \
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
              -pass env:FLOATSAVER_SIGNING_SECRET -out "$SIGNING_FILE"
          keytool -list -storetype PKCS12 -keystore "$SIGNING_FILE" \
            -storepass:env FLOATSAVER_SIGNING_SECRET >/dev/null
          echo "FLOATSAVER_SIGNING_KEYSTORE=$SIGNING_FILE" >> "$GITHUB_ENV"

      - name: Build and test debug APK
        env:
          FLOATSAVER_SIGNING_SECRET: ${{ secrets.FLOATSAVER_SIGNING_SECRET }}
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Give the APK a versioned file name
        env:
          APP_VERSION: ${{ steps.version.outputs.name }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          folder = Path("app/build/outputs/apk/debug")
          candidates = [p for p in folder.rglob("*.apk") if p.is_file() and p.stat().st_size > 0]
          if len(candidates) != 1:
              raise SystemExit(f"Expected one compiled APK, found: {[(str(p), p.stat().st_size) for p in candidates]}")
          apk = candidates[0]
          new_name = f"FloatSaver-v{os.environ['APP_VERSION']}-build{os.environ['GITHUB_RUN_NUMBER']}-arm64-debug.apk"
          target = folder / new_name
          apk.rename(target)
          print(f"Downloadable APK: {target} ({target.stat().st_size / 1e6:.1f} MB)")
          PY

      - name: Upload versioned APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatSaver-v${{ steps.version.outputs.name }}-build${{ github.run_number }}-arm64-APK
          path: app/build/outputs/apk/debug/FloatSaver-v*-arm64-debug.apk
          if-no-files-found: error
          retention-days: 30


      - name: Verify APK was signed
        env:
          APP_VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/FloatSaver-v${APP_VERSION}-build${GITHUB_RUN_NUMBER}-arm64-debug.apk"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --min-sdk-version 29 --verbose --print-certs "$APK"

      - name: Publish direct-download APK (without ZIP)
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/FloatSaver-v${APP_VERSION}-build${GITHUB_RUN_NUMBER}-arm64-debug.apk"
          # Stable one-tap URL plus a second version-labeled asset for clarity.
          STABLE_APK="app/build/outputs/apk/debug/FloatSaver-Android-arm64.apk"
          cp "$APK" "$STABLE_APK"
          NOTES="Android 64-bit用FloatSaverのテスト版APKです。ZIP解凍不要。最新版の固定リンク: https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-debug/FloatSaver-Android-arm64.apk。署名鍵を継続使用しています。"
          if gh release view latest-debug >/dev/null 2>&1; then
            for old_id in $(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest-debug" --jq '.assets[].id'); do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${old_id}"
            done
            gh release upload latest-debug "$APK" "$STABLE_APK"
            gh release edit latest-debug --title "FloatSaver v${APP_VERSION} (build ${GITHUB_RUN_NUMBER})" --notes "$NOTES"
          else
            gh release create latest-debug "$APK" "$STABLE_APK" --target "$GITHUB_SHA" \
              --title "FloatSaver v${APP_VERSION} (build ${GITHUB_RUN_NUMBER})" \
              --notes "$NOTES" --prerelease
          fi
